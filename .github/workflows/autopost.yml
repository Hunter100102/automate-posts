name: Auto Post (FB + LinkedIn)

on:
  workflow_dispatch: {}
  schedule:
    - cron: "0 14 */2 * *"   # every 2 days at 14:00 UTC

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - run: npm ci

      - run: node index.js
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          CONTENT_PROMPT: ${{ secrets.CONTENT_PROMPT }}
          BRAND_NAME: AutomateIT
          HASHTAGS: ${{ secrets.HASHTAGS }}
          ENABLED_PLATFORMS: facebook,linkedin

          FB_PAGE_ID: ${{ secrets.FB_PAGE_ID }}
          FB_PAGE_ACCESS_TOKEN: ${{ secrets.FB_PAGE_ACCESS_TOKEN }}

          LI_ACCESS_TOKEN: ${{ secrets.LI_ACCESS_TOKEN }}
          LI_MEMBER_URN: ${{ secrets.LI_MEMBER_URN }}